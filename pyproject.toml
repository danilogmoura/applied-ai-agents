[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-course"
version = "0.1.0"
description = "Formação prática em Agentes de IA construídos estritamente em Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Agents Course", email = "course@example.com"}
]
dependencies = [
    # LLM SDKs
    "openai>=1.10.0",
    "anthropic>=0.20.0",
    
    # Frameworks de Agentes
    "langgraph>=0.0.30",
    "langchain>=0.1.10",
    "langchain-openai>=0.1.0",
    
    # Embeddings e Vetores
    "chromadb>=0.4.24",
    "faiss-cpu>=1.7.4",
    
    # Utilitários
    "tiktoken>=0.6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    
    # API e Deploy
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "docker>=7.0.0",
    
    # Testes
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "responses>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "modules*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
